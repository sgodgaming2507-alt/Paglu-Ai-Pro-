name: Build Paglu AI Pro APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project & Copy UI
        run: |
          cordova create myApp com.paglu.aippro PagluAIPro
          cd myApp
          rm -rf www/*
          cp -r ../index.html www/
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paglu-ai-pro-debug
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
